<script>
  const BRAND_CONFIG = {
    systemName: "SafeTrack",
    companyName: "บมจ.อิตาเลียนไทย ดีเวล๊อปเมนต์",
    logoUrl: "logo.png"
  };

  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwfZ1hQhjm-pUIN-rYqbby39a6Dy37pVdhRZiW1tL7BVgG0Z6_6sBDcx_PCvtx9titUdA/exec";

  function callSafeTrackApi(action, payload = {}) {
    return fetch(GAS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: action, payload: payload })
    }).then(response => {
      if (!response.ok) throw new Error("การเชื่อมต่อเซิร์ฟเวอร์ขัดข้อง (HTTP " + response.status + ")");
      return response.json();
    });
  }

  let areaData = [];
  let userData = [];
  let allRiskReports = [];
  let filteredRiskReports = [];
  let currentReportForPrint = null;
  let selectedCorrectionReport = null;
  let allHistoryData = [];
  let dashboardSummaryCache = {};
  const MAX_MULTI_IMAGES = 6;
  let compressedImages = { beforeImage: [], afterImage: [] };

  const pageInformation = {
    dashboard: { title: 'ภาพรวมระบบ', subtitle: 'สรุปสถิติและสถานะการจัดการความเสี่ยง' },
    'add-report': { title: 'เพิ่มรายงานความเสี่ยง', subtitle: 'บันทึกข้อมูลความเสี่ยงที่ตรวจพบในพื้นที่' },
    reports: { title: 'รายการความเสี่ยง', subtitle: 'ค้นหา ดูรายละเอียด Before/After ส่งออก Excel และพิมพ์รายงาน' },
    corrections: { title: 'บันทึกผลการแก้ไข', subtitle: 'ตรวจสอบและบันทึกผลการแก้ไขความเสี่ยง' },
    history: { title: 'ประวัติการดำเนินงาน', subtitle: 'ติดตามประวัติการบันทึกและแก้ไขทั้งหมด' }
  };

  document.addEventListener('DOMContentLoaded', function () {
    applyBrandConfig();
    openUserGuideModal(false);
    setCurrentDateTime('reportDateTime');
    setCurrentDateTime('correctionDateTime');

    setupNavigation();
    setupImageCompression('beforeImage', 'beforePreviewWrap', 'beforePreview', 'beforeImageHint');
    setupImageCompression('afterImage', 'afterPreviewWrap', 'afterPreview', 'afterImageHint');

    loadMasterData();
    loadFullSystemData();

    document.getElementById('dashboardMonthFilter').addEventListener('change', applyDashboardPeriodFilter);
    document.getElementById('refreshDashboardBtn').addEventListener('click', () => loadFullSystemData(true));
    document.getElementById('printDashboardBtn').addEventListener('click', printDashboard);
    document.getElementById('refreshReportsBtn').addEventListener('click', () => loadFullSystemData(true));
    document.getElementById('refreshCorrectionBtn').addEventListener('click', () => loadFullSystemData(true));
    document.getElementById('fabAddReport').addEventListener('click', () => switchPage('add-report'));

    document.getElementById('closeReportDetailBtn').addEventListener('click', () => {
      document.getElementById('allReportDetailCard').classList.add('form-hidden');
    });

    document.getElementById('reportSearch').addEventListener('input', filterRiskReports);
    document.getElementById('reportStatusFilter').addEventListener('change', filterRiskReports);
    document.getElementById('reportAreaFilter').addEventListener('change', filterRiskReports);

    document.getElementById('riskForm').addEventListener('submit', submitRiskReport);
    document.getElementById('correctionForm').addEventListener('submit', submitCorrection);

    document.getElementById('cancelCorrectionBtn').addEventListener('click', clearSelectedReport);
    document.getElementById('clearCorrectionBtn').addEventListener('click', () => resetCorrectionForm(true));

    document.getElementById('resetRiskBtn').addEventListener('click', function () {
      setTimeout(() => {
        setCurrentDateTime('reportDateTime');
        clearImageField('beforeImage', 'beforePreviewWrap', 'beforePreview', 'beforeImageHint');
        updateAreaOptions();
      }, 0);
    });

    document.getElementById('sectionSelect').addEventListener('change', updateAreaOptions);
    document.getElementById('refreshHistoryBtn').addEventListener('click', () => loadActivityHistory(true));
    document.getElementById('historySearch').addEventListener('input', filterActivityHistory);
    document.getElementById('historyTypeFilter').addEventListener('change', filterActivityHistory);
  });

  function applyBrandConfig() {
    document.title = `${BRAND_CONFIG.systemName} | ${BRAND_CONFIG.companyName}`;
    document.getElementById('desktopSystemName').textContent = BRAND_CONFIG.systemName;
    document.getElementById('desktopCompanyName').textContent = BRAND_CONFIG.companyName;
    document.getElementById('mobileSystemName').textContent = BRAND_CONFIG.systemName;
    document.getElementById('mobileCompanyName').textContent = BRAND_CONFIG.companyName;
    document.getElementById('topbarCompanyName').textContent = BRAND_CONFIG.companyName;
    document.getElementById('sidebarFooterText').innerHTML =
      `<strong>${escapeHtml(BRAND_CONFIG.companyName)}</strong><br>ระบบจัดการความปลอดภัยในการทำงาน`;

    const fallbackItdSvg = `
      <svg viewBox="0 0 100 100" width="100%" height="100%">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#f39200" stroke-width="7"/>
        <path d="M50 18 A32 32 0 0 1 50 82" fill="none" stroke="#f39200" stroke-width="7"/>
        <line x1="25" y1="34" x2="25" y2="66" stroke="#f39200" stroke-width="7"/>
        <line x1="36" y1="34" x2="64" y2="34" stroke="#f39200" stroke-width="7"/>
        <line x1="50" y1="34" x2="50" y2="70" stroke="#f39200" stroke-width="7"/>
      </svg>`;

    const logoHtml = BRAND_CONFIG.logoUrl
      ? `<img src="${escapeHtml(BRAND_CONFIG.logoUrl)}" alt="ITD Logo" onerror="this.parentElement.innerHTML=\`${fallbackItdSvg.replace(/"/g, "'")}\`">`
      : fallbackItdSvg;

    document.getElementById('desktopLogoContainer').innerHTML = logoHtml;
    document.getElementById('mobileLogoContainer').innerHTML = logoHtml;
  }

  function showToast(message, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const iconSvg = type === 'error'
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6b6b" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="2.4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
    toast.innerHTML = `${iconSvg}<span>${escapeHtml(message)}</span>`;
    container.appendChild(toast);

    setTimeout(() => {
      toast.classList.add('fade-out');
      setTimeout(() => toast.remove(), 260);
    }, 3200);
  }

  function getHazardBadgeHtml(category) {
    const cat = String(category || '');
    let cls = '';
    let icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;

    if (cat.includes('ความปลอดภัย')) {
      cls = 'haz-safety';
      icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/></svg>`;
    } else if (cat.includes('กายภาพ')) {
      cls = 'haz-physical';
      icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`;
    } else if (cat.includes('เคมี')) {
      cls = 'haz-chemical';
      icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 3h6"/><path d="M10 9h4"/><path d="M10 3v6l-4 9a2 2 0 0 0 1.8 3h8.4a2 2 0 0 0 1.8-3l-4-9V3"/></svg>`;
    } else if (cat.includes('ชีวภาพ')) {
      cls = 'haz-biological';
      icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;
    } else if (cat.includes('การยศาสตร์')) {
      cls = 'haz-ergonomic';
      icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="5" r="2"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg>`;
    } else if (cat.includes('จิตสังคม')) {
      cls = 'haz-psychosocial';
      icon = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`;
    }

    return `<span class="tag ${cls}">${icon}<span>${escapeHtml(cat)}</span></span>`;
  }

  function setupNavigation() {
    document.querySelectorAll('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => switchPage(btn.dataset.page));
    });
  }

  function switchPage(page) {
    document.querySelectorAll('.nav-item').forEach(btn => btn.classList.toggle('active', btn.dataset.page === page));
    document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));

    const target = document.getElementById('page-' + page);
    if (target) target.classList.add('active');

    const fab = document.getElementById('fabAddReport');
    if (fab) fab.classList.toggle('hidden', page === 'add-report');

    const info = pageInformation[page];
    if (info) {
      document.getElementById('pageTitle').textContent = info.title;
      document.getElementById('pageSubtitle').textContent = info.subtitle;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (page === 'history' && allHistoryData.length === 0) loadActivityHistory(false);
  }

  function loadMasterData() {
    callSafeTrackApi('getInitialMasterData').then(function (res) {
      if (!res || !res.success) return;
      areaData = res.areas || [];
      userData = res.users || [];

      const datalist = document.getElementById('userListDatalist');
      if (datalist) {
        datalist.innerHTML = '';
        userData.forEach(item => {
          if (item.fullName) {
            const opt = document.createElement('option');
            opt.value = item.fullName;
            datalist.appendChild(opt);
          }
        });
      }

      const sections = [...new Set(areaData.map(a => a.section).filter(Boolean))];
      const sectionSelect = document.getElementById('sectionSelect');
      sectionSelect.innerHTML = '<option value="">เลือกพื้นที่หลัก</option>';
      sections.forEach(sec => {
        const opt = document.createElement('option');
        opt.value = sec;
        opt.textContent = sec;
        sectionSelect.appendChild(opt);
      });

      populateReportAreaFilter();
    }).catch(err => console.error('Master data error:', err));
  }

  function updateAreaOptions() {
    const section = document.getElementById('sectionSelect').value;
    const areaSelect = document.getElementById('areaSelect');
    areaSelect.innerHTML = '<option value="">เลือกพื้นที่ย่อย</option>';
    areaData.filter(a => a.section === section).forEach(area => {
      const opt = document.createElement('option');
      opt.value = area.areaId;
      opt.textContent = area.areaName;
      areaSelect.appendChild(opt);
    });
  }

  function loadFullSystemData(notify = false) {
    hideBoxMessage('dashboardMessage');
    hideBoxMessage('reportsMessage');
    hideBoxMessage('correctionListMessage');

    callSafeTrackApi('getSafeTrackFullDataset').then(function (res) {
      if (!res || !res.success) {
        const errMsg = (res && res.message) || 'ไม่สามารถโหลดข้อมูลได้';
        showBoxMessage('dashboardMessage', errMsg, 'error');
        showBoxMessage('reportsMessage', errMsg, 'error');
        return;
      }

      allRiskReports = Array.isArray(res.reports) ? res.reports : [];
      dashboardSummaryCache = res.summary || {};

      const pendingCount = Number(dashboardSummaryCache.pendingReports || 0);
      const badge = document.getElementById('pendingNavBadge');
      badge.textContent = pendingCount;
      badge.classList.toggle('show', pendingCount > 0);

      populateDashboardMonthFilter(allRiskReports);
      applyDashboardPeriodFilter();

      populateReportAreaFilter();
      filterRiskReports();

      const pendingList = allRiskReports.filter(r => r.status === 'บันทึกความเสี่ยงแล้ว');
      renderCorrectionReports(pendingList);

      if (notify) showToast('อัปเดตข้อมูลล่าสุดเรียบร้อยแล้ว');
    }).catch(function (err) {
      const msg = 'เกิดข้อผิดพลาดในการเชื่อมต่อ: ' + getErrorMessage(err);
      showBoxMessage('dashboardMessage', msg, 'error');
      showBoxMessage('reportsMessage', msg, 'error');
    });
  }

  function getMonthKeyFromDate(d) {
    if (!d) return '';
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function populateDashboardMonthFilter(reports) {
    const select = document.getElementById('dashboardMonthFilter');
    if (!select) return;
    const prevValue = select.value || 'ALL';

    const monthMap = new Map();
    reports.forEach(r => {
      const d = parseThaiDate(r.reportDateTime);
      if (d) {
        const key = getMonthKeyFromDate(d);
        if (!monthMap.has(key)) {
          const label = d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
          monthMap.set(key, { key, label, count: 0 });
        }
        monthMap.get(key).count++;
      }
    });

    const sortedMonths = Array.from(monthMap.values()).sort((a, b) => b.key.localeCompare(a.key));

    select.innerHTML = `<option value="ALL">📊 ภาพรวมทั้งหมด (สะสม ${reports.length} รายการ)</option>`;
    sortedMonths.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.key;
      opt.textContent = `📅 เดือน ${m.label} (${m.count} รายการ)`;
      select.appendChild(opt);
    });

    if (prevValue === 'ALL' || monthMap.has(prevValue)) {
      select.value = prevValue;
    } else {
      select.value = 'ALL';
    }
  }

  function applyDashboardPeriodFilter() {
    const select = document.getElementById('dashboardMonthFilter');
    const selectedMonth = select ? select.value : 'ALL';

    let targetReports = allRiskReports;
    let isAllPeriod = (selectedMonth === 'ALL');

    if (!isAllPeriod) {
      targetReports = allRiskReports.filter(r => {
        const d = parseThaiDate(r.reportDateTime);
        return d && getMonthKeyFromDate(d) === selectedMonth;
      });
    }

    const total = targetReports.length;
    const completed = targetReports.filter(r => r.status === 'แจ้งผลการแก้ไขแล้ว').length;
    const pending = total - completed;

    document.getElementById('totalReports').textContent = total.toLocaleString('th-TH');
    document.getElementById('pendingReports').textContent = pending.toLocaleString('th-TH');
    document.getElementById('completedReports').textContent = completed.toLocaleString('th-TH');

    if (isAllPeriod) {
      document.getElementById('totalReportsNote').textContent = 'จำนวนรายงานสะสมทั้งหมด';
      document.getElementById('activeAreasLabel').textContent = 'พื้นที่ที่ใช้งาน';
      document.getElementById('activeAreasNote').textContent = 'พื้นที่เปิดใช้งานในระบบ';
      document.getElementById('activeAreas').textContent = Number(dashboardSummaryCache.activeAreas || 0).toLocaleString('th-TH');
      document.getElementById('dashboardLatestTitle').textContent = 'รายการความเสี่ยงล่าสุด 10 รายการ';
    } else {
      const selectedOptionText = select.options[select.selectedIndex].text.replace(/^📅\s*/, '').replace(/\s*\(\d+.*\)$/, '');
      const distinctAreas = new Set(targetReports.map(r => [r.section, r.areaName].filter(Boolean).join('/')).filter(Boolean)).size;
      document.getElementById('totalReportsNote').textContent = `รายงานใน${selectedOptionText}`;
      document.getElementById('activeAreasLabel').textContent = 'พื้นที่ที่พบความเสี่ยง';
      document.getElementById('activeAreasNote').textContent = `พบจุดเสี่ยงใน${selectedOptionText}`;
      document.getElementById('activeAreas').textContent = distinctAreas.toLocaleString('th-TH');
      document.getElementById('dashboardLatestTitle').textContent = `รายการความเสี่ยงใน${selectedOptionText} (${total} รายการ)`;
    }

    renderDashboardAnalytics(targetReports, allRiskReports);
  }

  function renderMultiImagePreviews(inputId, wrapId, hintId) {
    const wrap = document.getElementById(wrapId);
    const hintEl = document.getElementById(hintId);
    const list = compressedImages[inputId] || [];

    if (!list.length) {
      wrap.innerHTML = '';
      wrap.style.display = 'none';
      hintEl.textContent = `รองรับภาพจากกล้องมือถือ (สูงสุด ${MAX_MULTI_IMAGES} รูป) ระบบจะปรับขนาดให้อัตโนมัติ`;
      return;
    }

    wrap.style.display = 'grid';
    wrap.classList.add('multi-preview-grid');
    wrap.innerHTML = list.map((item, idx) => `
      <div class="multi-preview-item">
        <img src="${escapeHtml(item.dataUrl)}" alt="รูปที่ ${idx + 1}" onclick="openImageLightbox('${escapeHtml(item.dataUrl)}', 'รูปที่ ${idx + 1} (${escapeHtml(item.fileName)})')">
        <button type="button" class="multi-remove-btn" onclick="removeSingleImage('${inputId}', '${wrapId}', '${hintId}', ${idx})">✕ ลบรูป ${idx + 1}</button>
      </div>
    `).join('');

    const totalKb = list.reduce((sum, item) => sum + Math.round((item.dataUrl.length * 3) / 4 / 1024), 0);
    hintEl.textContent = `เลือกแล้ว ${list.length} / ${MAX_MULTI_IMAGES} รูป (ขนาดรวม ~${totalKb} KB)`;
  }

  function removeSingleImage(inputId, wrapId, hintId, indexToRemove) {
    compressedImages[inputId] = (compressedImages[inputId] || []).filter((_, idx) => idx !== indexToRemove);
    if (compressedImages[inputId].length === 0) {
      document.getElementById(inputId).value = '';
    }
    renderMultiImagePreviews(inputId, wrapId, hintId);
  }

  function compressSingleFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const MAX = 1280;
          let width = img.width, height = img.height;
          if (width > MAX || height > MAX) {
            if (width > height) {
              height = Math.round(height * MAX / width);
              width = MAX;
            } else {
              width = Math.round(width * MAX / height);
              height = MAX;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve({ fileName: file.name, dataUrl: canvas.toDataURL('image/jpeg', 0.8) });
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function setupImageCompression(inputId, wrapId, _previewId, hintId) {
    const input = document.getElementById(inputId);
    input.setAttribute('multiple', 'multiple');

    input.addEventListener('change', async function () {
      const files = Array.from(input.files || []);
      if (!files.length) return;

      const validFiles = files.filter(f => f.type.startsWith('image/'));
      if (validFiles.length !== files.length) {
        showToast('ข้ามไฟล์ที่ไม่ใช่รูปภาพออกให้อัตโนมัติ', 'error');
      }

      const currentList = compressedImages[inputId] || [];
      const availableSlots = MAX_MULTI_IMAGES - currentList.length;

      if (availableSlots <= 0) {
        showToast(`แนบรูปได้สูงสุด ${MAX_MULTI_IMAGES} รูปต่อครั้ง`, 'error');
        input.value = '';
        return;
      }

      const filesToProcess = validFiles.slice(0, availableSlots);
      if (validFiles.length > availableSlots) {
        showToast(`เลือกได้เพิ่มอีก ${availableSlots} รูป (จำกัดสูงสุด ${MAX_MULTI_IMAGES} รูป)`, 'error');
      }

      const hintEl = document.getElementById(hintId);
      hintEl.textContent = `กำลังปรับขนาดรูปภาพ ${filesToProcess.length} รูป...`;

      try {
        const processed = await Promise.all(filesToProcess.map(compressSingleFile));
        compressedImages[inputId] = [...currentList, ...processed];
        renderMultiImagePreviews(inputId, wrapId, hintId);
      } catch (err) {
        showToast('เกิดข้อผิดพลาดในการย่อขนาดรูปภาพ', 'error');
        renderMultiImagePreviews(inputId, wrapId, hintId);
      }
      input.value = '';
    });
  }

  function clearImageField(inputId, wrapId, _previewId, hintId) {
    document.getElementById(inputId).value = '';
    compressedImages[inputId] = [];
    renderMultiImagePreviews(inputId, wrapId, hintId);
  }

  function dataUrlToFile(dataUrl, fileName) {
    const arr = dataUrl.split(',');
    const mimeMatch = arr[0].match(/:(.*?);/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) u8arr[n] = bstr.charCodeAt(n);
    return new File([u8arr], fileName, { type: mime });
  }

  function submitRiskReport(event) {
    event.preventDefault();
    const btn = document.getElementById('saveRiskBtn');
    hideBoxMessage('formMessage');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึกข้อมูล...';

    const attachedImages = (compressedImages.beforeImage || []).map(item => ({ ...item }));
    const firstImage = attachedImages[0] || null;

    const payload = {
      reportDateTime: document.getElementById('reportDateTime').value,
      reporter: document.getElementById('reporterSelect').value.trim(),
      areaId: document.getElementById('areaSelect').value,
      locationDetail: document.getElementById('locationDetail').value.trim(),
      hazardCategory: document.getElementById('hazardCategory').value,
      unsafeCondition: document.getElementById('unsafeCondition').value.trim(),
      potentialIncident: document.getElementById('potentialIncident').value.trim(),
      longTermControl: document.getElementById('longTermControl').value.trim(),
      supervisor: document.getElementById('supervisorSelect').value.trim(),
      beforeImage: firstImage,
      beforeImages: attachedImages
    };

    callSafeTrackApi('saveRiskReport', payload).then(function (res) {
      btn.disabled = false;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> บันทึกรายงานความเสี่ยง`;

      if (res && res.success) {

  function openLineShareModal(type, info, localImageObj = null) {
    const existing = document.getElementById('lineShareBackdrop');
    if (existing) existing.remove();

    let messageText = type === 'report'
      ? `⚠️ [แจ้งพบความเสี่ยง - ${BRAND_CONFIG.companyName}]\nรหัส: ${info.reportId}\nวันที่/เวลา: ${info.reportDateTime}\nพื้นที่: ${info.areaText}\nจุดที่พบ: ${info.locationDetail}\nประเภท: ${info.hazardCategory}\nรายละเอียด: ${info.unsafeCondition}\nผู้รับผิดชอบ: ${info.supervisor}\nผู้รายงาน: ${info.reporter}` + (info.imageUrl ? `\nภาพประกอบ: ${info.imageUrl}` : '')
      : `✅ [แจ้งผลการแก้ไขแล้ว - ${BRAND_CONFIG.companyName}]\nรหัส: ${info.reportId}\nวันที่แก้ไข: ${info.correctionDateTime}\nพื้นที่: ${info.areaText} (${info.locationDetail})\nผลการแก้ไข: ${info.correctionDetail}\nผู้ดำเนินการแก้ไข: ${info.correctedBy}\nผู้ตรวจสอบ (จป.): ${info.recordedBy}` + (info.imageUrl ? `\nภาพหลังแก้ไข: ${info.imageUrl}` : '');

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.id = 'lineShareBackdrop';

    const box = document.createElement('div');
    box.className = 'modal-box';
    const hasImageFile = Boolean(localImageObj && localImageObj.dataUrl);

    box.innerHTML = `
      <div class="modal-header">
        <h3 class="modal-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#06c755" stroke-width="2.3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          สรุปข้อความแจ้งกลุ่ม LINE
        </h3>
        <button type="button" class="modal-close" onclick="document.getElementById('lineShareBackdrop').remove()">×</button>
      </div>
      ${hasImageFile ? `<div class="line-tip-box">💡 <strong>วิธีส่งรูปขึ้นแชท LINE ทันที:</strong> กดปุ่มสีส้มด้านล่าง ระบบจะคัดลอกข้อความให้อัตโนมัติพร้อมเปิดหน้าแชร์รูปภาพ ให้เลือกแอป LINE &gt; ส่งรูป &gt; แล้วกด <strong>วาง (Paste)</strong> ข้อความตามเข้าไปได้เลยครับ</div>` : ''}
      <div class="line-preview-box" id="lineShareText"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('lineShareBackdrop').remove()">ปิดหน้าต่าง</button>
        <button type="button" class="btn btn-primary" id="copyLineTextBtn">📋 คัดลอกข้อความ</button>
        ${hasImageFile ? `<button type="button" class="btn btn-orange" id="shareImageLineBtn">📲 ส่งรูปภาพ + คัดลอกข้อความเข้า LINE</button>` : ''}
        <a class="btn btn-line" style="text-decoration:none;" target="_blank" rel="noopener noreferrer"
           href="https://line.me/R/msg/text/?${encodeURIComponent(messageText)}">ส่งเฉพาะข้อความเข้า LINE ↗</a>
      </div>
    `;

    backdrop.appendChild(box);
    document.body.appendChild(backdrop);
    document.getElementById('lineShareText').textContent = messageText;

    const fallbackCopy = (txt) => {
      const ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    };

    const copyTextHelper = () => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(messageText).catch(() => fallbackCopy(messageText));
      }
      fallbackCopy(messageText);
      return Promise.resolve();
    };

    document.getElementById('copyLineTextBtn').addEventListener('click', function () {
      const btn = this;
      copyTextHelper().then(() => {
        showToast('คัดลอกข้อความลงคลิปบอร์ดแล้ว');
        btn.textContent = '✓ คัดลอกแล้ว!';
        setTimeout(() => { btn.textContent = '📋 คัดลอกข้อความ'; }, 2000);
      });
    });

    if (hasImageFile) {
      document.getElementById('shareImageLineBtn').addEventListener('click', async function () {
        await copyTextHelper();
        showToast('คัดลอกข้อความแล้ว กำลังเปิดหน้าต่างส่งรูปภาพ...');
        try {
          const imgFile = dataUrlToFile(localImageObj.dataUrl, (info.reportId || 'safetrack') + '.jpg');
          if (navigator.canShare && navigator.canShare({ files: [imgFile] })) {
            await navigator.share({ files: [imgFile], title: 'รายงาน SafeTrack ' + (info.reportId || '') });
          } else {
            const a = document.createElement('a');
            a.href = localImageObj.dataUrl;
            a.download = (info.reportId || 'safetrack') + '.jpg';
            a.click();
            window.open('https://line.me/R/msg/text/?' + encodeURIComponent(messageText), '_blank');
          }
        } catch (err) {
          if (err && err.name !== 'AbortError') {
            window.open('https://line.me/R/msg/text/?' + encodeURIComponent(messageText), '_blank');
          }
        }
      });
    }
  }

  function shareCurrentReportToLine() {
    if (!currentReportForPrint) return;
    const r = currentReportForPrint;
    const isCompleted = r.status === 'แจ้งผลการแก้ไขแล้ว';
    const corrections = Array.isArray(r.corrections) ? r.corrections : [];
    const latestCorr = corrections.length > 0 ? corrections[corrections.length - 1] : null;
    const areaText = [r.section, r.areaName].filter(Boolean).join(' / ');

    if (isCompleted && latestCorr) {
      openLineShareModal('correction', {
        reportId: r.reportId,
        correctionDateTime: latestCorr.correctionDateTime,
        areaText: areaText,
        locationDetail: r.locationDetail,
        correctionDetail: latestCorr.correctionDetail,
        correctedBy: latestCorr.correctedBy,
        recordedBy: latestCorr.recordedBy,
        imageUrl: latestCorr.afterImageUrl || ''
      });
    } else {
      openLineShareModal('report', {
        reportId: r.reportId,
        reportDateTime: r.reportDateTime,
        areaText: areaText,
        locationDetail: r.locationDetail,
        hazardCategory: r.hazardCategory,
        unsafeCondition: r.unsafeCondition,
        supervisor: r.supervisor || '-',
        reporter: r.reporter,
        imageUrl: r.beforeImageUrl || ''
      });
    }
  }

  function exportReportsToExcel() {
    const targetList = (Array.isArray(filteredRiskReports) && filteredRiskReports.length > 0)
      ? filteredRiskReports
      : allRiskReports;

    if (!targetList || targetList.length === 0) {
      showToast('ไม่มีข้อมูลรายการความเสี่ยงให้ส่งออก', 'error');
      return;
    }

    const headers = [
      'รหัสรายงาน',
      'วันและเวลาที่พบ',
      'พื้นที่หลัก (Section)',
      'พื้นที่ย่อย',
      'ตำแหน่งที่พบความเสี่ยง',
      'ประเภทอันตราย',
      'สภาพการณ์ที่ไม่ปลอดภัย',
      'อุบัติเหตุที่อาจเกิดขึ้น',
      'แนวทางควบคุมระยะยาว',
      'ผู้รายงาน',
      'ผู้รับผิดชอบ',
      'สถานะปัจจุบัน',
      'วันและเวลาแก้ไข',
      'ผู้ดำเนินการแก้ไข',
      'รายละเอียดผลการแก้ไข',
      'ผู้ตรวจสอบ (จป.)',
      'ลิงก์ภาพก่อนแก้ไข',
      'ลิงก์ภาพหลังแก้ไข'
    ];

    const dataRows = targetList.map(r => {
      const corrections = Array.isArray(r.corrections) ? r.corrections : [];
      const latestCorr = corrections.length > 0 ? corrections[corrections.length - 1] : {};
      return [
        r.reportId || '',
        r.reportDateTime || '',
        r.section || '',
        r.areaName || '',
        r.locationDetail || '',
        r.hazardCategory || '',
        r.unsafeCondition || '',
        r.potentialIncident || '',
        r.longTermControl || '',
        r.reporter || '',
        r.supervisor || '',
        r.status || '',
        latestCorr.correctionDateTime || '',
        latestCorr.correctedBy || '',
        latestCorr.correctionDetail || '',
        latestCorr.recordedBy || '',
        r.beforeImageUrl || '',
        latestCorr.afterImageUrl || ''
      ];
    });

    const now = new Date();
    const dateStamp = `${now.getFullYear() + 543}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    if (typeof XLSX !== 'undefined') {
      const aoa = [headers, ...dataRows];
      const ws = XLSX.utils.aoa_to_sheet(aoa);

      const colWidths = headers.map((headerText, colIdx) => {
        let maxLen = String(headerText).length;
        dataRows.forEach(row => {
          const cellStr = String(row[colIdx] || '');
          const firstLine = cellStr.split('\n')[0];
          if (firstLine.length > maxLen) {
            maxLen = firstLine.length;
          }
        });
        return { wch: Math.min(Math.max(maxLen + 6, 15), 48) };
      });
      ws['!cols'] = colWidths;

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'รายการความเสี่ยง');
      XLSX.writeFile(wb, `SafeTrack_Report_${dateStamp}.xlsx`);

      showToast(`ดาวน์โหลดไฟล์ Excel (.xlsx) จำนวน ${targetList.length} รายการ สำเร็จ!`);
    } else {
      const escapeCsv = (val) => `"${String(val == null ? '' : val).replace(/"/g, '""')}"`;
      const csvContent = '\uFEFF' + [headers.map(escapeCsv).join(','), ...dataRows.map(row => row.map(escapeCsv).join(','))].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `SafeTrack_Report_${dateStamp}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast(`ดาวน์โหลดไฟล์ตารางข้อมูล (${targetList.length} รายการ) สำเร็จ!`);
    }
  }

  function populateReportAreaFilter() {
    const select = document.getElementById('reportAreaFilter');
    const prev = select.value;
    select.innerHTML = '<option value="">ทุกพื้นที่</option>';
    const sections = [...new Set([...areaData.map(a => a.section), ...allRiskReports.map(r => r.section)].filter(Boolean))];
    sections.forEach(sec => {
      const opt = document.createElement('option');
      opt.value = sec;

      select.appendChild(opt);
    });
    if (sections.includes(prev)) select.value = prev;

  function filterRiskReports() {
    const kw = document.getElementById('reportSearch').value.trim().toLowerCase();
    const status = document.getElementById('reportStatusFilter').value;
    const section = document.getElementById('reportAreaFilter').value;

    filteredRiskReports = allRiskReports.filter(r => {
      const text = [r.reportId, r.reporter, r.locationDetail, r.hazardCategory, r.unsafeCondition, r.areaName, r.section].join(' ').toLowerCase();
      return (!kw || text.includes(kw)) && (!status || r.status === status) && (!section || r.section === section);
    });

    renderAllRiskReports();
  }

    return `
      <img class="report-detail-image" src="${escapeHtml(imgSrc)}" alt="${escapeHtml(altText)}"
           onclick="openImageLightbox('${escapeHtml(imgSrc)}', '${escapeHtml(altText)} (คลิกที่ว่างเพื่อปิด)')"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div style="display:none; font-size:12px; color:var(--muted); padding:10px 0;">ไม่สามารถแสดงตัวอย่างภาพได้ กรุณากดลิงก์ด้านล่าง</div>
      <a class="before-image-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">เปิดดูภาพต้นฉบับใน Drive ↗</a>
    `;
  }

  function getDriveDisplayUrl(fileId, url, size = 'w1000') {
    let id = String(fileId || '').trim();
    if (!id && url) {
      const match = String(url).match(/\/file\/d\/([^/]+)/) || String(url).match(/[?&]id=([^&]+)/);
      if (match && match[1]) id = match[1];
    }
    return id ? ('https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=' + size) : (url || '');
  }

  function submitCorrection(event) {
    event.preventDefault();
    if (!selectedCorrectionReport) return showBoxMessage('correctionMessage', 'กรุณาเลือกรายการความเสี่ยงก่อน', 'error');

    const btn = document.getElementById('saveCorrectionBtn');
    hideBoxMessage('correctionMessage');
    btn.disabled = true;
    btn.textContent = 'กำลังบันทึกผล...';

    const attachedAfterImages = (compressedImages.afterImage || []).map(item => ({ ...item }));
    const firstAfterImage = attachedAfterImages[0] || null;

    const payload = {
      reportId: selectedCorrectionReport.reportId,
      correctionDateTime: document.getElementById('correctionDateTime').value,
      correctedBy: document.getElementById('correctedBy').value.trim(),
      correctionDetail: document.getElementById('correctionDetail').value.trim(),
      recordedBy: document.getElementById('correctionRecordedBy').value.trim(),
      afterImageDataUrl: firstAfterImage ? firstAfterImage.dataUrl : '',
      afterImages: attachedAfterImages
    };

    callSafeTrackApi('saveCorrection', payload).then(function (res) {
      btn.disabled = false;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg> ยืนยันบันทึกผลการแก้ไข`;

      if (res && res.success) {
        showToast('บันทึกผลการแก้ไขเรียบร้อยแล้ว!');
        showBoxMessage('correctionMessage', '✓ ' + res.message, 'success');
        clearSelectedReport();
        loadFullSystemData(false);
        allHistoryData = [];

        if (res.summaryForLine) openLineShareModal('correction', res.summaryForLine, firstAfterImage);
      } else {
        showBoxMessage('correctionMessage', (res && res.message) || 'ไม่สามารถบันทึกผลการแก้ไขได้', 'error');
      }
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = 'ยืนยันบันทึกผลการแก้ไข';
      showBoxMessage('correctionMessage', 'เกิดข้อผิดพลาด: ' + getErrorMessage(err), 'error');
    });
  }

  function buildPrintDocumentHtml(title, bodyHtml) {
    const printedAt = new Date().toLocaleString('th-TH');
    return `
      <!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><title>${escapeHtml(title)}</title>
      <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
      <style>${getPrintStyles()}</style></head>
      <body>${bodyHtml}<div class="print-footer">พิมพ์จากระบบ ${escapeHtml(BRAND_CONFIG.systemName)} (${escapeHtml(BRAND_CONFIG.companyName)}) เมื่อ ${escapeHtml(printedAt)}</div></body></html>
    `;
  }

  function triggerPrintOnDocument(doc, winToPrint) {
    const imgs = Array.from(doc.images || []);
    Promise.all(imgs.map(img => new Promise(resolve => {
      if (img.complete) return resolve();
      img.onload = resolve;
      img.onerror = resolve;
      setTimeout(resolve, 2500);
    }))).then(() => {
      setTimeout(() => {
        try {
          winToPrint.focus();
          winToPrint.print();
        } catch (e) {
          window.print();
        }
      }, 200);
    });
  }

  function executePrintWindow(title, bodyHtml) {
    const fullHtml = buildPrintDocumentHtml(title, bodyHtml);
    const printWin = window.open('', '_blank');

    if (printWin) {
      printWin.document.open();
      printWin.document.write(fullHtml);
      printWin.document.close();
      triggerPrintOnDocument(printWin.document, printWin);
      return;
    }

    const oldFrame = document.getElementById('safetrackPrintFrame');
    if (oldFrame) oldFrame.remove();

    const iframe = document.createElement('iframe');
    iframe.id = 'safetrackPrintFrame';
    iframe.style.position = 'fixed';
    iframe.style.right = '0';
    iframe.style.bottom = '0';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = '0';
    document.body.appendChild(iframe);

    const frameDoc = iframe.contentDocument || iframe.contentWindow.document;
    frameDoc.open();
    frameDoc.write(fullHtml);
    frameDoc.close();
    triggerPrintOnDocument(frameDoc, iframe.contentWindow);
  }

      showToast('กรุณาเปิดดูรายละเอียดรายงานก่อนสั่งพิมพ์', 'error');

    executePrintWindow('รายงาน ' + currentReportForPrint.reportId, buildSingleReportPrintHtml(currentReportForPrint));
  }

  function printFilteredReports() {
    const targetList = (Array.isArray(filteredRiskReports) && filteredRiskReports.length > 0)

    if (!targetList || targetList.length === 0) {
      showToast('ไม่มีรายการให้พิมพ์', 'error');

    if (targetList.length > 30 && !confirm(`คุณกำลังจะพิมพ์ทั้งหมด ${targetList.length} รายการ ต้องการดำเนินการต่อหรือไม่?`)) {

  function renderDashboardAnalytics(reports, allReportsForTrend = null) {
    const completed = reports.filter(r => r.status === 'แจ้งผลการแก้ไขแล้ว').length;
    const pending = reports.length - completed;

    const alertBox = document.getElementById('overdueAlertContainer');
    if (alertBox) {
      const pendingItems = reports
        .filter(r => r.status !== 'แจ้งผลการแก้ไขแล้ว')
        .map(r => ({ report: r, date: parseThaiDate(r.reportDateTime) }))
        .filter(x => x.date !== null)
        .sort((a, b) => a.date - b.date);

      if (pendingItems.length > 0) {
        const oldest = pendingItems[0];
        const diffDays = Math.max(0, Math.floor((new Date() - oldest.date) / (1000 * 60 * 60 * 24)));
        const dayText = diffDays === 0 ? 'วันนี้' : `ค้างมาแล้ว ${diffDays} วัน`;
        alertBox.innerHTML = `
          <div class="overdue-banner">
            <div>
              <div class="overdue-title">⚠️ รายการค้างแก้ไขนานที่สุด: ${escapeHtml(oldest.report.reportId)} (${dayText})</div>
              <div class="overdue-desc">พื้นที่: ${escapeHtml([oldest.report.section, oldest.report.areaName].filter(Boolean).join(' / '))} — ${escapeHtml(oldest.report.locationDetail)}</div>
            </div>
            <button type="button" class="btn btn-orange btn-small" onclick="switchPage('corrections')">ไปบันทึกผลแก้ไข →</button>
          </div>
        `;
      } else {
        alertBox.innerHTML = '';
      }
    }

    const statusEl = document.getElementById('statusOverview');
    statusEl.innerHTML = reports.length === 0
      ? '<div class="empty-state">ยังไม่มีรายงานความเสี่ยงในช่วงเวลาที่เลือก</div>'
      : `<div class="donut-wrap">
        ${buildDonutSvg([pending, completed], ['#e6a23c', '#239b75'], reports.length, 'ทั้งหมด')}
        <div class="chart-legend">
          <div class="legend-item"><span class="legend-dot" style="background:#e6a23c"></span><span>รอดำเนินการ</span><span class="legend-value">${pending} (${(pending/reports.length*100).toFixed(1)}%)</span></div>
          <div class="legend-item"><span class="legend-dot" style="background:#239b75"></span><span>ดำเนินการแล้ว</span><span class="legend-value">${completed} (${(completed/reports.length*100).toFixed(1)}%)</span></div>
        </div>
      </div>`;

    const catGroups = groupByKey(reports, r => r.hazardCategory || 'ไม่ระบุ');
    const catEl = document.getElementById('hazardCategoryChart');
    if (!catGroups.length) {
      catEl.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูล</div>';
    } else {
      const cols = catGroups.map((_, i) => chartColors[i % chartColors.length]);

        ${buildDonutSvg(catGroups.map(x => x.total), cols, reports.length, 'รายการ')}
        <div class="chart-legend">${catGroups.map((g, i) => `
          <div class="legend-item"><span class="legend-dot" style="background:${cols[i]}"></span><span>${escapeHtml(g.label)}</span><span class="legend-value">${g.total}</span></div>
        `).join('')}</div>
      </div>`;
    }

    const areaGroups = groupByKey(reports, r => [r.section, r.areaName].filter(Boolean).join(' / ') || 'ไม่ระบุ');
    const areaEl = document.getElementById('areaReportsChart');
    if (!areaGroups.length) {
      areaEl.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูล</div>';
    } else {
      const max = areaGroups[0].total || 1;
      areaEl.innerHTML = `<div class="bar-list">${areaGroups.slice(0, 7).map((g, i) => `
        <div class="bar-row">
          <div>${escapeHtml(g.label)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${(g.total/max*100)}%; background:${chartColors[i % chartColors.length]}"></div></div>

    renderMonthlyTrend(allReportsForTrend || reports);

    document.getElementById('areaSummaryTable').innerHTML = areaGroups.length ? `

      <tbody>${areaGroups.map(g => {
        const sub = reports.filter(r => ([r.section, r.areaName].filter(Boolean).join(' / ') || 'ไม่ระบุ') === g.label);
        const done = sub.filter(r => r.status === 'แจ้งผลการแก้ไขแล้ว').length;

      <tbody>${catGroups.map(g => `<tr><td>${escapeHtml(g.label)}</td><td class="num">${g.total}</td><td class="num">${(g.total/reports.length*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>` : '<div class="empty-state">ไม่มีข้อมูล</div>';

    document.getElementById('dashboardLatestTable').innerHTML = reports.length ? `
      <table class="dashboard-data-table"><thead><tr><th>รหัส</th><th>วันที่พบ</th><th>พื้นที่</th><th>ประเภท</th><th>สถานะ</th></tr></thead>
      <tbody>${reports.slice(0, 10).map(r => `<tr><td>${escapeHtml(r.reportId)}</td><td>${escapeHtml(r.reportDateTime)}</td><td>${escapeHtml([r.section, r.areaName].filter(Boolean).join(' / '))}</td><td>${escapeHtml(r.hazardCategory)}</td><td>${escapeHtml(r.status)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty-state">ไม่มีข้อมูล</div>';
  }

  function renderMonthlyTrend(reports) {
    const el = document.getElementById('monthlyTrendChart');
    const valid = reports.map(r => parseThaiDate(r.reportDateTime)).filter(Boolean);
    if (!valid.length) return el.innerHTML = '<div class="empty-state">ไม่มีข้อมูลวันที่สำหรับแสดงแนวโน้ม</div>';

    const latest = new Date(Math.max(...valid.map(d => d.getTime())));
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(latest.getFullYear(), latest.getMonth() - i, 1);
      months.push({
        key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
        label: d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' }),
        total: 0
      });
    }
    valid.forEach(d => {
      const m = months.find(x => x.key === `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
      if (m) m.total++;
    });

    const max = Math.max(1, ...months.map(m => m.total));
    const w = 680, h = 200, left = 36, right = 20, top = 20, bottom = 36;
    const plotW = w - left - right, plotH = h - top - bottom;
    const pts = months.map((m, i) => ({ x: left + (i * plotW / (months.length - 1)), y: top + plotH - (m.total / max) * plotH, m }));

    el.innerHTML = `<svg class="trend-svg" viewBox="0 0 ${w} ${h}">
      <line x1="${left}" y1="${top + plotH}" x2="${w - right}" y2="${top + plotH}" stroke="#cbd5e1"/>
      <polyline points="${pts.map(p => `${p.x},${p.y}`).join(' ')}" fill="none" stroke="#0e9f9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p => `
        <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#0e9f9a"/>
        <text x="${p.x}" y="${p.y - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="#142b45">${p.m.total}</text>
        <text x="${p.x}" y="${h - 10}" text-anchor="middle" font-size="11" fill="#64748b">${p.m.label}</text>
      `).join('')}
    </svg>`;
  }

  function buildDonutSvg(values, colors, total, caption) {
    const r = 46, c = 2 * Math.PI * r;
    let offset = 0;
    const circles = values.map((v, i) => {
      const len = total > 0 ? (v / total) * c : 0;
      const str = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${colors[i]}" stroke-width="20" stroke-dasharray="${len.toFixed(2)} ${(c - len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
      offset += len;
      return str;
    }).join('');

    return `<svg class="donut-svg" viewBox="0 0 140 140">
      <circle cx="70" cy="70" r="${r}" fill="none" stroke="#edf1f5" stroke-width="20"/>
      ${circles}
      <text x="70" y="68" text-anchor="middle" font-size="22" font-weight="800" fill="#142b45">${total}</text>
      <text x="70" y="84" text-anchor="middle" font-size="10" fill="#64748b">${escapeHtml(caption)}</text>
    </svg>`;
  }

  function loadActivityHistory(notify = false) {
    const list = document.getElementById('historyList');
    list.innerHTML = '<div class="skeleton-box"></div><div class="skeleton-box"></div>';

    callSafeTrackApi('getActivityHistory').then(function (res) {
      if (!res || !res.success) return showBoxMessage('historyMessage', (res && res.message) || 'โหลดประวัติไม่สำเร็จ', 'error');
      allHistoryData = res.data || [];
      const corrCount = allHistoryData.filter(x => x.action.includes('แก้ไข')).length;
      document.getElementById('historyTotal').textContent = allHistoryData.length.toLocaleString('th-TH');
      document.getElementById('historyReportTotal').textContent = (allHistoryData.length - corrCount).toLocaleString('th-TH');
      document.getElementById('historyCorrectionTotal').textContent = corrCount.toLocaleString('th-TH');
      filterActivityHistory();
      if (notify) showToast('อัปเดตประวัติการดำเนินงานแล้ว');
    }).catch(err => showBoxMessage('historyMessage', 'โหลดประวัติไม่สำเร็จ: ' + getErrorMessage(err), 'error'));
  }

  function filterActivityHistory() {
    const kw = document.getElementById('historySearch').value.trim().toLowerCase();
    const type = document.getElementById('historyTypeFilter').value;

    const filtered = allHistoryData.filter(item => {
      const isCorr = item.action.includes('แก้ไข');
      const matchType = !type || (type === 'correction' && isCorr) || (type === 'report' && !isCorr);
      const text = [item.reportId, item.action, item.actionBy, item.detail, item.areaText, item.locationDetail].join(' ').toLowerCase();
      return matchType && (!kw || text.includes(kw));
    });

    document.getElementById('historyResultCount').textContent = `แสดง ${filtered.length} กิจกรรม จากทั้งหมด ${allHistoryData.length} กิจกรรม`;
    const list = document.getElementById('historyList');
    list.innerHTML = '';

    if (!filtered.length) return list.innerHTML = '<div class="empty-state">ไม่พบประวัติกิจกรรม</div>';

    const checkSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>`;
    const plusSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;

    filtered.forEach(item => {
      const isCorr = item.action.includes('แก้ไข');
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div class="history-icon ${isCorr ? 'correction' : ''}">${isCorr ? checkSvg : plusSvg}</div>
        <div>
          <div class="history-heading">
            <div class="history-action">${escapeHtml(item.action)}</div>
            <div class="history-date">${escapeHtml(item.actionDateTime)}</div>
          </div>
          <div class="history-report-id">รหัสรายงาน: ${escapeHtml(item.reportId)}</div>
          <div class="history-description">${escapeHtml(item.detail)}</div>
          <div class="history-meta">
            <span>โดย: ${escapeHtml(item.actionBy)}</span>
            <span>พื้นที่: ${escapeHtml(item.areaText || '-')}</span>
          </div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function setCurrentDateTime(id) {
    const input = document.getElementById(id);
    if (!input) return;
    const now = new Date();
    input.value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  }

  function showBoxMessage(id, msg, type) {
    const el = document.getElementById(id);
    if (el) { el.textContent = msg; el.className = 'message ' + type; el.style.display = 'block'; }
  }

  function hideBoxMessage(id) {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  }

  function groupByKey(items, fn) {
    const map = new Map();
    items.forEach(item => { const k = fn(item); map.set(k, (map.get(k) || 0) + 1); });
    return Array.from(map.entries()).map(([label, total]) => ({ label, total })).sort((a, b) => b.total - a.total);
  }

  function parseThaiDate(str) {
    if (!str) return null;
    const m = String(str).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!m) return null;
    let y = Number(m[3]);
    if (y > 2400) y -= 543;
    return new Date(y, Number(m[2]) - 1, Number(m[1]));
  }

  function escapeHtml(val) {
    return String(val == null ? '' : val).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function getErrorMessage(err) {
    return err ? (err.message || String(err)) : 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ';
  }
